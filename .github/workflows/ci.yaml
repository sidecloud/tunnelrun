name: Docker Images CI

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  setup:
    name: Load versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Build matrix
        id: matrix
        run: |
          matrix=$(jq -cn \
            --arg ollama "$(cat versions/ollama)" \
            --arg llama "$(cat versions/llama-server)" \
            '[
              {"target":"ollama","version":$ollama,"var_name":"OLLAMA_TAG"},
              {"target":"llama-server","version":$llama,"var_name":"LLAMA_SERVER_TAG"}
            ]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v6
        with:
          targets: ${{ matrix.target }}
          push: false
          set: |
            *.cache-from=type=gha,scope=${{ matrix.target }}
        env:
          ${{ matrix.var_name }}: ${{ matrix.version }}
