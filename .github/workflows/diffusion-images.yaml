name: Docker Diffusion Images

concurrency:
  group: diffusion-images-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      target:
        description: Diffusion image flavor to build and publish
        required: true
        default: all
        type: choice
        options:
          - all
          - cuda
          - rocm

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    name: Load diffusion pin
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Build matrix
        id: matrix
        run: |
          diffusion="$(cat versions/diffusion_version.txt)"
          printf '%s\n' "$diffusion" | grep -Eq '^[0-9a-f]{40}$'
          matrix=$(jq -cn \
            --arg commit "$diffusion" \
            --arg short_commit "${diffusion:0:7}" \
            --arg requested "${{ inputs.target }}" \
            '[
              {"target":"vllm-diffusion","version":$commit,"short_version":$short_commit,"var_name":"VLLM_DIFFUSION_COMMIT"},
              {"target":"vllm-rocm-diffusion","version":$commit,"short_version":$short_commit,"var_name":"VLLM_DIFFUSION_COMMIT"}
            ] |
            if $requested == "cuda" then [.[0]]
            elif $requested == "rocm" then [.[1]]
            else . end')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk for source build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v7
        with:
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.target }}
        env:
          ${{ matrix.var_name }}: ${{ matrix.version }}
          VLLM_DIFFUSION_COMMIT_SHORT: ${{ matrix.short_version }}
