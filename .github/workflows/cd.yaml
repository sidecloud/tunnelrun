name: Docker Images CD

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    name: Load versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Build matrix
        id: matrix
        run: |
          matrix=$(jq -cn \
            --arg ollama "$(cat versions/ollama)" \
            --arg llama "$(cat versions/llama-server)" \
            '[
              {"target":"ollama","version":$ollama,"var_name":"OLLAMA_TAG"},
              {"target":"llama-server","version":$llama,"var_name":"LLAMA_SERVER_TAG"}
            ]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v7
        with:
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.target }}
        env:
          ${{ matrix.var_name }}: ${{ matrix.version }}
