x-build_args: &build_args
  OLLAMA_TAG: ${OLLAMA_TAG:-0.14.3}
  LLAMA_SERVER_TAG: ${LLAMA_SERVER_TAG:-b7786}
  VLLM_TAG: ${VLLM_TAG:-v0.23.0}
  CLOUDFLARED_TAG: ${CLOUDFLARED_TAG:-2026.1.1}

x-diffusion_build_args: &diffusion_build_args
  CLOUDFLARED_TAG: ${CLOUDFLARED_TAG:-2026.1.1}
  VLLM_DIFFUSION_REPO: ${VLLM_DIFFUSION_REPO:-https://github.com/mmastrac/vllm.git}
  VLLM_DIFFUSION_REF: ${VLLM_DIFFUSION_REF:-structured-reads-main}
  VLLM_DIFFUSION_COMMIT: ${VLLM_DIFFUSION_COMMIT:-ceb8eebf3eedddb964a50180f33838a9a6b13ee2}

volumes:
  cache:
  triton:

services:
  ollama:
    image: sidecloud/tunnelrun:ollama
    scale: 0
    build:
      context: deploy
      target: ollama
      args:
        <<: *build_args
      tags:
        - sidecloud8808/tunnelrun:ollama-${OLLAMA_TAG:-0.14.3}
        - sidecloud8808/tunnelrun:ollama
        - sidecloud8808/tunnelrun:latest
      cache_from:
        - type=gha,mode=max
      cache_to:
        - type=gha,mode=max
    environment:
      TUNNEL_TOKEN:
    volumes:
      - ./deploy/ollama_supervisord.conf:/etc/supervisor/conf.d/ollama.conf
      - cache:/home/ollama/.ollama
    sysctls:
      net.ipv4.ping_group_range: "65532 65532"

  llama-server:
    image: sidecloud/tunnelrun:llama-server
    scale: 0
    build:
      context: deploy
      target: llama-server
      args:
        <<: *build_args
      tags:
        - sidecloud8808/tunnelrun:llama-server-cuda-${LLAMA_SERVER_TAG:-b7786}
        - sidecloud8808/tunnelrun:llama-server
      cache_from:
        - type=gha,mode=max
      cache_to:
        - type=gha,mode=max
    environment:
      TUNNEL_TOKEN:
    volumes:
      - ./deploy/llama_server_supervisord.conf:/etc/supervisor/conf.d/llama-server.conf
      - cache:/root/.cache
      - triton:/root/.triton
    sysctls:
      net.ipv4.ping_group_range: "65532 65532"

  llama-server-vulkan:
    image: sidecloud/tunnelrun:llama-server-vulkan
    scale: 0
    build:
      context: deploy
      target: llama-server-vulkan
      args:
        <<: *build_args
      tags:
        - sidecloud8808/tunnelrun:llama-server-vulkan-${LLAMA_SERVER_TAG:-b7786}
        - sidecloud8808/tunnelrun:llama-server-vulkan
      cache_from:
        - type=gha,mode=max
      cache_to:
        - type=gha,mode=max
    environment:
      TUNNEL_TOKEN:
    volumes:
      - ./deploy/llama_server_supervisord.conf:/etc/supervisor/conf.d/llama-server.conf
      - cache:/root/.cache
    sysctls:
      net.ipv4.ping_group_range: "65532 65532"
    devices:
      - /dev/dri:/dev/dri

  llama-server-rocm:
    image: sidecloud/tunnelrun:llama-server-rocm
    scale: 0
    build:
      context: deploy
      target: llama-server-rocm
      args:
        <<: *build_args
      tags:
        - sidecloud8808/tunnelrun:llama-server-rocm-${LLAMA_SERVER_TAG:-b7786}
        - sidecloud8808/tunnelrun:llama-server-rocm
      cache_from:
        - type=gha,mode=max
      cache_to:
        - type=gha,mode=max
    environment:
      TUNNEL_TOKEN:
    volumes:
      - ./deploy/llama_server_supervisord.conf:/etc/supervisor/conf.d/llama-server.conf
      - cache:/root/.cache
    sysctls:
      net.ipv4.ping_group_range: "65532 65532"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

  vllm:
    image: sidecloud/tunnelrun:vllm
    scale: 0
    build:
      context: deploy
      target: vllm
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        <<: *build_args
      tags:
        - sidecloud8808/tunnelrun:vllm-${VLLM_TAG:-v0.15.1}
        - sidecloud8808/tunnelrun:vllm
      cache_from:
        - type=gha,mode=max
      cache_to:
        - type=gha,mode=max
    environment:
      TUNNEL_TOKEN:
      VLLM_LOGGING_LEVEL: DEBUG
    volumes:
      - ./deploy/vllm_supervisord.conf:/etc/supervisor/supervisord.conf
      - ./deploy/vllm.config.yaml:/etc/vllm/config.yaml
      - cache:/root/.cache
      - triton:/root/.triton
    sysctls:
      net.ipv4.ping_group_range: "65532 65532"

  vllm-rocm:
    image: sidecloud/tunnelrun:vllm-rocm
    scale: 0
    build:
      context: deploy
      target: vllm-rocm
      args:
        <<: *build_args
      tags:
        - sidecloud8808/tunnelrun:vllm-rocm
      cache_from:
        - type=gha,mode=max
      cache_to:
        - type=gha,mode=max
    environment:
      TUNNEL_TOKEN:
      VLLM_LOGGING_LEVEL: DEBUG
    volumes:
      - ./deploy/vllm_supervisord.conf:/etc/supervisor/supervisord.conf
      - ./deploy/vllm.config.yaml:/etc/vllm/config.yaml
      - cache:/root/.cache
      - triton:/root/.triton
    sysctls:
      net.ipv4.ping_group_range: "65532 65532"
    devices:
      - /dev/kfd
      - /dev/dri

  vllm-diffusion:
    image: sidecloud/tunnelrun:vllm-diffusion
    scale: 0
    build:
      context: .
      dockerfile: deploy/Dockerfile.vllm-diffusion
      target: vllm-diffusion
      args:
        <<: *diffusion_build_args
      tags:
        - sidecloud8808/tunnelrun:vllm-diffusion-${VLLM_DIFFUSION_COMMIT_SHORT:-ceb8eeb}
        - sidecloud8808/tunnelrun:vllm-diffusion
      cache_from:
        - type=gha,mode=max
      cache_to:
        - type=gha,mode=max
    environment:
      TUNNEL_TOKEN:
      VLLM_LOGGING_LEVEL: DEBUG
    volumes:
      - ./deploy/vllm_supervisord.conf:/etc/supervisor/supervisord.conf
      - ./deploy/vllm.config.yaml:/etc/vllm/config.yaml
      - cache:/root/.cache
      - triton:/root/.triton
    sysctls:
      net.ipv4.ping_group_range: "65532 65532"

  vllm-rocm-diffusion:
    image: sidecloud/tunnelrun:vllm-rocm-diffusion
    scale: 0
    build:
      context: .
      dockerfile: deploy/Dockerfile.vllm-rocm-diffusion
      target: vllm-rocm-diffusion
      args:
        <<: *diffusion_build_args
        REMOTE_VLLM: "1"
        VLLM_REPO: ${VLLM_DIFFUSION_REPO:-https://github.com/mmastrac/vllm.git}
        VLLM_BRANCH: ${VLLM_DIFFUSION_COMMIT:-ceb8eebf3eedddb964a50180f33838a9a6b13ee2}
      tags:
        - sidecloud8808/tunnelrun:vllm-rocm-diffusion-${VLLM_DIFFUSION_COMMIT_SHORT:-ceb8eeb}
        - sidecloud8808/tunnelrun:vllm-rocm-diffusion
      cache_from:
        - type=gha,mode=max
      cache_to:
        - type=gha,mode=max
    environment:
      TUNNEL_TOKEN:
      VLLM_LOGGING_LEVEL: DEBUG
    volumes:
      - ./deploy/vllm_supervisord.conf:/etc/supervisor/supervisord.conf
      - ./deploy/vllm.config.yaml:/etc/vllm/config.yaml
      - cache:/root/.cache
      - triton:/root/.triton
    sysctls:
      net.ipv4.ping_group_range: "65532 65532"
    devices:
      - /dev/kfd
      - /dev/dri

